version: '3.9'

# ─────────────────────────────────────────────────────────
#  OpsDesk — Docker Compose
#  Services: postgres  |  backend  |  frontend
#
#  FIRST-TIME SETUP:
#    1. Copy backend/.env.example → backend/.env and fill in values.
#       For Docker, set DATABASE_URL=postgresql://opsdesk:opsdesk_pass@postgres:5432/opsdesk
#    2. docker compose up --build
#    3. In a separate terminal, run migrations (one-time):
#         docker compose exec backend npx prisma migrate deploy
#    4. Optionally seed test data:
#         docker compose exec backend npx prisma db seed
#
#  SUBSEQUENT STARTS:
#    docker compose up            (data is persisted in the 'pgdata' volume)
#    docker compose down          (stops containers, data preserved)
#    docker compose down -v       (DANGER: also removes volumes / erases DB)
# ─────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk_pass
      POSTGRES_DB: opsdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk -d opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Express + Prisma) ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to point at the compose postgres service
      DATABASE_URL: postgresql://opsdesk:opsdesk_pass@postgres:5432/opsdesk
      # Allow the containerized frontend to call the backend
      CORS_ORIGIN: http://localhost:5175
    ports:
      - "4000:3001"

  # ── Frontend (Vite build → nginx) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass VITE_API_URL from environment or fallback to localhost for dev
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5175:80"

volumes:
  pgdata:
    driver: local
